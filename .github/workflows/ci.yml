name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Basic repository check
        run: |
          echo "Automated check started"
          test -f README.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify HA discovery and snapshot regression guards
        run: |
          python -m pip install -r crawlers/requirements.txt pytest
          python -m pytest tests/test_ha_resources_offline.py tests/test_licensing_inventory.py tests/test_previous_snapshot.py tests/test_regression_guardrail.py -q
