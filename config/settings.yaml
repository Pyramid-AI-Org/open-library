        technical_circulars_data_js_url: "https://www.dsd.gov.hk/assets/js/EN/guideline-data-compress-165.js"
        practice_notes_page_url: "https://www.dsd.gov.hk/EN/Technical_Documents/DSD_Technical_Circulars_and_Practice_Notes/DSD_Practice_Notes/index.html"
