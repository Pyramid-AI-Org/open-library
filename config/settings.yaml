  # ============================================================================
  # DIRECTORY - Telephone Directory
  # ============================================================================
  directory:
    label: "Telephone Directory"
    schedule:
      enabled: true
      interval_days: 1
    request_delay_seconds: 0.25
    request_jitter_seconds: 0.10
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:
      tel_directory:
        # HKSAR Government Telephone Directory (English) people crawler.
        index_url: "https://tel.directory.gov.hk/index_ENG.html"
        max_pages: 2000
        refresh_sample_percent: 5
        force_refresh_after_days: 30
        detail_fetch_workers: 8

  # ============================================================================
  # HERBARIUM - Hong Kong Herbarium
  # ============================================================================
  herbarium:
    label: "Hong Kong Herbarium"
    schedule:
      enabled: true
      interval_days: 1
    request_delay_seconds: 0.25
    request_jitter_seconds: 0.10
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 200000
    pages:
      herbarium:
        # Hong Kong Herbarium Plant Database crawler.
        api_url: "https://www.herbarium.gov.hk/plantdb/GetSpeciesList.php"
        plant_type:
          - "Angiosperms (dicotyledons)"
          - "Angiosperms (monocotyledons)"
          - "Gymnosperms"
          - "Pteridophytes"
        taxon_rank:
          - "family"
          - "genus"
          - "species"
        order_by: "family"
        page_size: 4000

