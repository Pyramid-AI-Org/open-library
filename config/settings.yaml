      epd_document_sweep:
        # Pages holding documents this department's own crawlers do not
        # reach. Signed duplicates and zipped superseded editions are
        # excluded: they carry no text the current version does not.
        page_urls:
          - "https://www.epd.gov.hk/epd/english/environmentinhk/air/air_quality_objectives/aqoreview2016.html"
          - "https://www.epd.gov.hk/epd/english/environmentinhk/noise/help_corner/da.html"
          - "https://www.epd.gov.hk/epd/english/environmentinhk/noise/guide_ref/noise_guidelines.html"
          - "https://www.epd.gov.hk/epd/english/environmentinhk/air/air_quality_objectives/2030aqosreview.html"
          - "https://www.epd.gov.hk/epd/english/environmentinhk/air/air_quality_objectives/public-consultation.html"
          - "https://www.epd.gov.hk/epd/english/resources_pub/policy_documents/index_archive.html"
          - "https://www.epd.gov.hk/epd/english/environmentinhk/air/studyrpts/ferries_ULSD.html"
          - "https://www.epd.gov.hk/epd/english/environmentinhk/air/studyrpts/acid_rain_archives.html"
          - "https://www.epd.gov.hk/epd/english/environmentinhk/waste/guide_ref/daso_gr.html"
          - "https://www.epd.gov.hk/epd/english/environmentinhk/air/air_quality_objectives/air_quality_objectives.html"
          - "https://www.epd.gov.hk/epd/english/environmentinhk/air/air_quality_objectives/Historical_AQO.html"
          - "https://www.epd.gov.hk/epd/english/environmentinhk/air/air_maincontent.html"
        exclude_url_patterns:
          - '\d(se|ov)\.(pdf|docx?)$'
          - '\.zip$'
        doc_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx"]

