# Public configuration (safe to commit)
# Organized by source (folder) with nested pages.
# Each source has a label and shared settings that pages inherit.

http:
  user_agent: "OpenLibraryCrawler/0.1 (+https://github.com/<your-org>/<your-repo>)"
  timeout_seconds: 60
  max_retries: 3

archive_policy:
  # Refresh the active month's base and rewrite that month's day deltas on this day.
  mid_month_refresh_day: 15

crawlers:
  # ============================================================================
  # HKSAR - HKSAR Press Releases
  # ============================================================================
  hksar:
    label: "HKSAR Press Releases"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.info.gov.hk"
    pages:
      hksar_press_releases:
        # HKSAR Government Press Releases daily listing crawler.
        # Iterates day-by-day for the last 2 years and extracts press release detail links
        # within div#contentBody.
        days_back: 730
        locales:
          - "en"
          - "tc"
        listing_path_template: "/gia/general/{yyyymm}/{dd}.htm"
        listing_path_template_tc: "/gia/general/{yyyymm}/{dd}c.htm"
        request_delay_seconds: 0.5
        request_jitter_seconds: 0.25
        per_day_limit: 200
        max_total_records: 50000
        backoff_base_seconds: 0.5
        backoff_jitter_seconds: 0.25

  # ============================================================================
  # LEGCO - Legislative Council
  # ============================================================================
  legco:
    label: "Legislative Council"
    schedule:
      # [2026-09-01] Suspended. www.legco.gov.hk serves an incomplete certificate
      # chain (leaf only, no Hongkong Post intermediate), so every fetch fails
      # verification and all seven pages collect nothing. The fix is on branch
      # fix/hk-silent-failures; re-enable together with it. Left disabled so the
      # regression guardrail below is not permanently red on these seven rows.
      enabled: false
      interval_days: 1
    base_url: "https://www.legco.gov.hk"
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:
      development_meetings:
        # LegCo Panel on Development meetings minutes and papers PDF crawler.
        panel_slug: "development"
        years_back: 5

      development_papers_reports:
        # LegCo Panel on Development papers-and-reports PDF crawler.
        panel_slug: "development"
        years_back: 5

      finance_meetings:
        # LegCo Finance Committee meetings minutes and papers PDF crawler.
        panel_slug: "finance"
        years_back: 5

      finance_papers_reports:
        # LegCo Finance Committee papers-and-reports PDF crawler.
        panel_slug: "finance"
        years_back: 5

      finance_financial_proposals_considered:
        # LegCo Finance Committee financial proposals considered PDF crawler.
        panel_slug: "finance"
        years_back: 5

      public_works_project_proposal_considered:
        # LegCo Public Works Subcommittee project proposals considered PWSC PDF crawler.
        committee_slug: "public-works"
        years_back: 5

      public_works_papers_reports:
        # LegCo Public Works Subcommittee papers-and-reports PDF crawler.
        committee_slug: "public-works"
        years_back: 5

  # ============================================================================
  # DEVB - The Development Bureau
  # ============================================================================
  devb:
    label: "The Development Bureau"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.devb.gov.hk"
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:
      devb_document_sweep:
        # Pages holding documents this department's own crawlers do not
        # reach. Signed duplicates and zipped superseded editions are
        # excluded: they carry no text the current version does not.
        page_urls:
          - "https://www.devb.gov.hk/en/publications_and_press_releases/publications/construction_site_safety_manual/index.html"
          - "https://www.devb.gov.hk/en/publications_and_press_releases/publications/devb-harmonisation-guideline/index.html"
          - "https://www.devb.gov.hk/en/construction_sector_matters/contractors/applications_as_public_works/index.html"
          - "https://www.devb.gov.hk/en/construction_sector_matters/contractors/considerate_contractors_site/index.html"
          - "https://www.devb.gov.hk/en/construction_sector_matters/contractors/contractor_management_handbook/index.html"
          - "https://www.devb.gov.hk/en/construction_sector_matters/contractors/contractor_management_handbook_prelease/index.html"
          - "https://www.devb.gov.hk/en/construction_sector_matters/contractors/helping_business/index.html"
          - "https://www.devb.gov.hk/en/construction_sector_matters/contractors/updated_contractor_information_prescribed_forms/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual-concrete-seminar-2023/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2005/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2006/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2007/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2008/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2009/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2010/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2011/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2012/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2013/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2014/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2015/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2016/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2017/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2018/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2019/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2021/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/annual_concrete_seminar_2022/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/low_carbon_concrete_trophy_competition_2022/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/concrete_technology/past_research_projects/index.html"
          - "https://www.devb.gov.hk/en/issues_in_focus/streamlining_development_control/administrative_measures/index.html"
        exclude_url_patterns:
          - '(se|ov)\.(pdf|docx?)$'
          - '\.zip$'
        doc_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx"]

      devb_press_releases:
        # DevB Press Releases (English) index crawler.
        years_back: 10
        type: "all"

      devb_speeches_and_presentations:
        # DevB Speeches and Presentations (English) index crawler.
        years_back: 10
        type: "all"

      devb_general_circulars:
        # DevB General Circulars (English) crawler.
        page_url: "https://www.devb.gov.hk/en/publications_and_press_releases/general_circulars/index.html"

      devb_planning_and_lands_technical_circulars:
        # DevB Planning and Lands Technical Circulars (English) crawler.
        page_url: "https://www.devb.gov.hk/en/publications_and_press_releases/technical_circulars/planning_and_lands_technical_circular/index.html"

      devb_works_technical_circulars_um:
        # DevB Works Technical Circulars (in force) via JS dataset.
        # The dataset runs back to 1973; years_back: 10 was reading only a
        # tenth of it and leaving ~270 circulars uncollected.
        data_js_url: "https://www.devb.gov.hk/filemanager/technicalcirculars/list_technicalcirculars_53.js"
        years_back: 55
        # A superseded circular still governs the work approved under it.
        include_superseded: true
        include_revision_year_matches: true
        request_delay_seconds: 0.0
        request_jitter_seconds: 0.0

      devb_publications:
        # DevB Publications (English) recursive document crawler.
        seed_url: "https://www.devb.gov.hk/en/publications_and_press_releases/publications/index.html"
        scope_prefix: "/en/publications_and_press_releases/publications/"
        content_element_id: "content"
        exclude_path_prefixes:
          - "/en/publications_and_press_releases/publications/glossary_of_terms"
          - "/en/publications_and_press_releases/publications/standardised_components_and_practices"
        max_depth: 6
        max_pages: 2000
        max_out_links_per_page: 500

      # devb_construction_site_safety_manual:
      #   # DevB Construction Site Safety Manual crawler.
      #   page_url: "https://www.devb.gov.hk/en/publications_and_press_releases/publications/construction_site_safety_manual/index.html"
      #   content_element_id: "content"

