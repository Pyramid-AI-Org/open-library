# ============================================================================
# NPARKS - National Parks Board (Singapore)
# ----------------------------------------------------------------------------
# Paste into config/settings.yaml under `crawlers:`, keeping this indentation.
# Scope: sources/sg-nparks/scope.yaml. Platform: sitefinity.
#
# REWRITTEN 21 August 2026. The previous block seeded three section spiders
# from three known pages and collected 119 records. Two of those three seeds
# are JavaScript-rendered listings, so the spider saw the seed and nothing
# under it. Driving from the sitemap instead gives 260 pages and 199
# documents, and the rows below are named for site sections rather than for
# seeds so a coverage regression can be localised.
#
# The counter-intuitive part, worth keeping in mind for other Sitefinity
# sites: every individual page fetch worked perfectly the whole time. Page
# fetches succeeding is not the same as the crawl working.
# ============================================================================
  nparks:
    label: "National Parks Board"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.nparks.gov.sg"
    # Non-standard path. /sitemap.xml itself 404s.
    sitemap_url: "https://www.nparks.gov.sg/sitemap/sitemap.xml"
    document_hosts:
      - "www.nparks.gov.sg"
      - "isomer-user-content.by.gov.sg"
      - "skyrisegreenery.nparks.gov.sg"
      - "cuge.nparks.gov.sg"
    document_path_prefixes:
      - "/docs/default-source/"
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip"]
    strip_document_query: true
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:
      publications_resources:
        # 111 pages, 2 documents. That ratio is correct - see the module
        # docstring before "fixing" it.
        engine: sitemap
        path_prefixes:
          - "/publications-resources"
        emit_page_records: true

      services:
        # Development plan submission, tree conservation, permits, forms.
        engine: sitemap
        path_prefixes:
          - "/services"
        emit_page_records: true

      nature:
        engine: sitemap
        path_prefixes:
          - "/nature"
        emit_page_records: true

      learn:
        # The largest document count in this source.
        engine: sitemap
        path_prefixes:
          - "/learn"
        emit_page_records: true

      who_we_are:
        engine: sitemap
        path_prefixes:
          - "/who-we-are"
        emit_page_records: true

      cuge_standards:
        # Separate origin, so a separate run.
        engine: spider
        start_urls:
          - "https://cuge.nparks.gov.sg/resources/publications/"
          - "https://cuge.nparks.gov.sg/resources/"
        allowed_hosts:
          - "cuge.nparks.gov.sg"
        path_prefixes:
          - "/"
        max_depth: 3
        max_pages: 200
        emit_page_records: true

    # Deliberately not crawled: /visit (739 park and trail pages),
    # /news (182 press releases), /get-involved. See scope.yaml.

# ============================================================================
# PARLIAMENT - Parliament of Singapore (Singapore)
# ----------------------------------------------------------------------------
# Paste into config/settings.yaml under `crawlers:`, keeping this indentation.
# Scope: sources/sg-parliament/scope.yaml. Platform: next-js over Directus.
#
# CORRECTED 21 August 2026. The first version of this block described a
# section spider over /docs/default-source/. Both halves were wrong: the
# listings render from a payload rather than from anchors, and the documents
# are served from /api/media/. It ran cleanly and collected nothing.
# ============================================================================
  parliament:
    label: "Parliament of Singapore"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.parliament.gov.sg"
    document_hosts:
      - "www.parliament.gov.sg"
    document_path_prefixes:
      - "/api/media/"
      - "/docs/default-source/"     # the corporate side of the site
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip"]
    strip_document_query: true
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    # robots.txt and the listing pages answer HTTP 202 with an empty body when
    # the bot-mitigation interstitial fires. That is a challenge, not a "no
    # content" - retry it rather than recording zero.
    retry_statuses: [202, 429, 500, 502, 503, 504]
    max_total_records: 50000
    pages:
      order_paper:
        # 2,168 documents, 1955 to date. No pagination: the whole collection
        # ships in the first response under `initData`.
        engine: flight_payload
        start_url: "https://www.parliament.gov.sg/parliamentary-business/order-paper"
        payload_key: "initData"
        label: "Order Paper"
        record:
          url_field: "fileUrl"
          title_fields: ["fileTitle", "filename_download"]
          date_fields: ["date"]

      votes_and_proceedings:
        # 619 documents, 2005 to date. Ten records in the payload, the rest
        # through the server action below.
        engine: server_action
        start_url: "https://www.parliament.gov.sg/parliamentary-business/votes-and-proceedings"
        label: "Votes and Proceedings"
        # A BUILD HASH, not a constant. It changes on every site deploy and a
        # stale value returns HTTP 500 - which this engine raises on rather
        # than reporting an empty collection. To re-capture: open the listing
        # in a browser, click page 2, and read the `next-action` request
        # header off that POST.
        action_id: "7f643b87656c0c1046945063694ee9a404a648a5c4"
        form_fields:
          _1_parliOptions: ""
          _1_from: ""
          _1_to: ""
          "0": '[null,"$K1"]'
        offset_field: "_1_offset"
        limit_field: "_1_limit"
        page_size: 1000          # the limit is not capped server-side
        record:
          file_field: "report"
          url_template: "/api/media/{id}/{filename}"
          title_fields: ["description", "title"]
          date_fields: ["date"]

      bills_introduced:
        # 772 documents, 2006 to date.
        engine: server_action
        start_url: "https://www.parliament.gov.sg/parliamentary-business/bills-introduced"
        label: "Bills Introduced"
        action_id: "7f20370fa7fced498f1fcafee03b02cce4cebdbd3c"
        form_fields:
          _1_name: ""
          _1_title: ""
          _1_yearOption: ""
          "0": '[null,"$K1"]'
        offset_field: "_1_offset"
        limit_field: "_1_limit"
        page_size: 1000
        record:
          file_field: "file"
          extra_file_fields: ["corrigenda"]
          url_template: "/api/media/{id}/{filename}"
          title_fields: ["description"]
          date_fields: ["date_introduced"]

# ============================================================================
# PUB - PUB, Singapore's National Water Agency (Singapore)
# ----------------------------------------------------------------------------
# Paste into config/settings.yaml under `crawlers:`, keeping this indentation.
# Scope: sources/sg-pub/scope.yaml. Platform: sitecore.
# ============================================================================
  pub:
    label: "PUB, Singapore's National Water Agency"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.pub.gov.sg"
    document_hosts:
      - "www.pub.gov.sg"
    document_path_prefixes:
      - "/-/media/"
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip"]
    strip_document_query: true
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:
      guides_and_handbooks:
        # The direct analogue of the DSD technical manuals and
        # guidelines. It carries the Drainage Handbook (Managing
        # Urban Runoff), the ABC Waters Design Guidelines and
        # their engineering procedures, the Flood-Resilient
        # Developments Guidebook, the Earth Control Measures
        # guidebook, the Sewer CCTV guidebook and the Handbook on
        # Application for Water Supply. It is also the one high-
        # value PUB listing that is fully server-rendered, so it
        # is the most reliable row in this source.
        start_urls:
          - "https://www.pub.gov.sg/Professionals/Resources/Guides-and-Handbooks"
        allowed_path_prefixes:
          - "/Professionals/Resources/Guides-and-Handbooks"
        max_depth: 2
        max_pages: 30
        emit_page_records: true
      codes_of_practice:
        # The binding drainage and sewerage codes: the Code of
        # Practice on Surface Water Drainage, the Code of Practice
        # on Sewerage and Sanitary Works, the Code of Practice on
        # Coastal Protection, and the standard drawings issued
        # with them. These are what a qualified person designs to,
        # and they are the closest thing PUB has to the DSD
        # technical circulars.
        start_urls:
          - "https://www.pub.gov.sg/Professionals/Resources/Code-of-Practices"
        allowed_path_prefixes:
          - "/Professionals/Resources/Code-of-Practices"
        max_depth: 3
        max_pages: 30
        emit_page_records: true
      circulars:
        # Industry circulars - the running record of how PUB's
        # requirements change, and the equivalent of the DSD
        # technical circulars and the WSD plumbing circulars.
        # Categories include Licensed Plumbers, Building Plans,
        # Earth Control Measures, Fittings and Standards, Used
        # Water Management and Water Storage Tanks.
        start_urls:
          - "https://www.pub.gov.sg/Professionals/Resources/Circulars"
        allowed_path_prefixes:
          - "/Professionals/Resources/Circulars"
        max_depth: 2
        max_pages: 20
        emit_page_records: true
      requirements:
        # The WSD half of this source. Water supply services,
        # water fittings, water storage tanks, licensed plumbers
        # and qualified-person submissions. The Hong Kong deck
        # asked for the web text of these pages as well as the
        # PDFs, and that matters more here than it did there: PUB
        # states most plumbing requirements as page text rather
        # than as documents, so a PDF-only crawl would return
        # almost nothing from a section that is genuinely
        # substantive.
        start_urls:
          - "https://www.pub.gov.sg/Professionals/Requirements"
        allowed_path_prefixes:
          - "/Professionals/Requirements"
        max_depth: 3
        max_pages: 60
        emit_page_records: true

# ============================================================================
# SCDF - Singapore Civil Defence Force (Singapore)
# ----------------------------------------------------------------------------
# Paste into config/settings.yaml under `crawlers:`, keeping this indentation.
# Scope: sources/sg-scdf/scope.yaml. Platform: sitefinity.
# ============================================================================
  scdf:
    label: "Singapore Civil Defence Force"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.scdf.gov.sg"
    sitemap_url: "https://www.scdf.gov.sg/sitemap/sitemap.xml"
    document_hosts:
      - "www.scdf.gov.sg"
    document_path_prefixes:
      - "/docs/default-source/"
