# Singapore sources configuration (separate from Hong Kong settings.yaml)

http:
  user_agent: "OpenLibraryCrawler/0.1 (+https://github.com/Pyramid-AI-Org/open-library)"
  timeout_seconds: 60
  max_retries: 3

archive_policy:
  mid_month_refresh_day: 15

crawlers:
# ============================================================================
# BCA - Building and Construction Authority (Singapore)
# ----------------------------------------------------------------------------
# Paste this block into config/settings.yaml under `crawlers:`, keeping the
# two-space indentation shown here.
#
# Scope is defined in sources/sg-bca/scope.yaml. Every `pages:` entry below
# corresponds to one crawler row there; if you change a path prefix here,
# change it there too so the approved scope and the running code stay in step.
# ============================================================================
  bca:
    label: "Building and Construction Authority"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www1.bca.gov.sg"
    sitemap_url: "https://www1.bca.gov.sg/sitemap.xml"

    # Isomer-Next wraps page content in <main id="main-content">. Scoping to it
    # keeps the header, mega-menu, breadcrumb and footer out of the results.
    content_element_id: "main-content"

    # BCA serves its own uploads from the shared Isomer asset host, so a file
    # on isomer-user-content.by.gov.sg reached from a BCA page is a BCA
    # document. sso.agc.gov.sg is Singapore Statutes Online: not BCA's, but it
    # holds the Acts and subsidiary legislation the codes are written under, so
    # those links are recorded as external references rather than dropped.
    document_hosts:
      - "www1.bca.gov.sg"
      - "www2.bca.gov.sg"
      - "isomer-user-content.by.gov.sg"
      # Circulars are frequently published behind the government URL shortener
      # or on the CORENET portal rather than on BCA's own host.
      - "go.gov.sg"
      - "info.corenet.gov.sg"
      - "www.corenet.gov.sg"
      - "www.mom.gov.sg"
    external_document_hosts:
      - "sso.agc.gov.sg"
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".zip"]

    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000

    pages:
      safety_and_standards:
        # The regulatory core: Building Control Act and its regulations, the
        # accessibility codes, construction quality, plan-submission
        # guidelines, periodic inspections, lifts and escalators, amusement
        # rides, civil defence shelters.
        path_prefixes:
          - "/safety-and-standards/"
        exclude_path_patterns:
          # Enforcement notices name individual firms and change constantly;
          # they are case records, not standards.
          - "^/safety-and-standards/enforcement-actions/"
        emit_page_records: true
        max_pages: 200

      sustainability_legislation:
        # Building Control (Environmental Sustainability) regime only. The
        # Green Mark scheme pages under /sustainability/greenmark/ are
        # promotional and stay out of scope.
        path_prefixes:
          - "/sustainability/legislation-on-environmental-sustainability-for-buildings/"
        emit_page_records: true
        max_pages: 60

      guidebooks_and_publications:
        # Technical guidebooks. The section landing page is itself a
        # collection listing, so the payload reader picks up items that are
        # not otherwise linked from any sub-page.
        path_prefixes:
          - "/resources/guidebooks-and-publications/"
        emit_page_records: true
        max_pages: 60

      accessibility_and_universal_design:
        # Universal Design guides and index material. Filed under
        # home-and-building-owners on the site, but technical design guidance.
        path_prefixes:
          - "/home-and-building-owners/accessibility-and-universal-design/"
        emit_page_records: true
        max_pages: 40

      circulars:
        # ~400 items, ten per rendered page, all present in one response.
        listing_urls:
          - "https://www1.bca.gov.sg/resources/circulars/"
        emit_page_records: true

# ============================================================================
# EMA - Energy Market Authority (Singapore)
# ----------------------------------------------------------------------------
# Paste into config/settings.yaml under `crawlers:`, keeping this indentation.
# Scope: sources/sg-ema/scope.yaml. Platform: adobe-aem.
#
# REWRITTEN 21 August 2026. The previous block ran three section spiders and
# collected 94 records. EMA's listings are Angular, so the spiders saw the
# landing pages and nothing under them. Two out-of-band indexes fix it:
#
#   /bin/servlets/custom-sitemap   JSON, all 1,452 published pages
#   /graphql/list.json             every AEM persisted query, with its text
#
# Executing the persisted queries took the source from 94 records to 822.
# Neither endpoint is linked from anywhere; both were found by loading a
# listing in a browser and reading performance.getEntriesByType('resource').
# ============================================================================
  ema:
    label: "Energy Market Authority"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.ema.gov.sg"
    page_index_url: "https://www.ema.gov.sg/bin/servlets/custom-sitemap"
    # Pagepath in that index is the authoring path; strip this prefix for the
    # public URL.
    page_index_path_prefix: "/content/corporate/language-masters/en/home"
    graphql_index_url: "https://www.ema.gov.sg/graphql/list.json"
    document_hosts:
      - "www.ema.gov.sg"
    document_path_prefixes:
      - "/content/dam/corporate/"
    external_document_hosts:
      - "sso.agc.gov.sg"
      - "assets.egazette.gov.sg"
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip"]
    strip_document_query: true
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:

      # --- collections behind persisted queries -----------------------------

      licences:
        engine: api_index
        base_url: "https://www.ema.gov.sg"
        endpoints:
          - "/graphql/execute.json/corporate/licensing-information"
        found_on: "https://www.ema.gov.sg/regulations-licences/licences"

      regulatory_publications:
        engine: api_index
        base_url: "https://www.ema.gov.sg"
        endpoints:
          - "/graphql/execute.json/corporate/regulationPolicyPapersModel"
        found_on: "https://www.ema.gov.sg/regulations-licences/regulatory-publications"

      circulars:
        engine: api_index
        base_url: "https://www.ema.gov.sg"
        endpoints:
          - "/graphql/execute.json/corporate/circularsPageList-query"
        found_on: "https://www.ema.gov.sg/regulations-licences/regulatory-publications"

      forms:
        engine: api_index
        base_url: "https://www.ema.gov.sg"
        endpoints:
          - "/graphql/execute.json/corporate/resourcesFormsList"
        found_on: "https://www.ema.gov.sg/resources/forms"

      educational_materials:
        engine: api_index
        base_url: "https://www.ema.gov.sg"
        endpoints:
          # REST first: it carries publishdate, the GraphQL route does not.
          - "/bin/corporate-site/education-material"
          - "/graphql/execute.json/corporate/resources_educational_material"
        found_on: "https://www.ema.gov.sg/resources/educational-materials"

      corporate_publications:
        engine: api_index
        base_url: "https://www.ema.gov.sg"
        endpoints:
          - "/graphql/execute.json/corporate/resourceCorporatePublicationModel"
        found_on: "https://www.ema.gov.sg/resources/corporate-publications"

      # --- sections that really are server-rendered --------------------------

      regulations:
        engine: spider
        start_urls:
          - "https://www.ema.gov.sg/regulations-licences/regulations/acts-regulations"
        allowed_path_prefixes:
          - "/regulations-licences/regulations"
        max_depth: 3
        max_pages: 40
        emit_page_records: true

      statistics:
        # /corporate/statistics-list answers HTTP 500, so this row is served by
        # the section crawl instead. Listed in tolerate_statuses so a future
        # attempt on the query fails visibly rather than silently.
        engine: spider
        tolerate_statuses: [500]
        start_urls:
          - "https://www.ema.gov.sg/resources/statistics"
          - "https://www.ema.gov.sg/resources/singapore-energy-statistics"
        allowed_path_prefixes:
          - "/resources/statistics"
          - "/resources/singapore-energy-statistics"
        max_depth: 3
        max_pages: 60
        emit_page_records: true

      industry_reports:
        engine: spider
        start_urls:
          - "https://www.ema.gov.sg/resources/industry-reports"
        allowed_path_prefixes:
          - "/resources/industry-reports"
        max_depth: 3
        max_pages: 30
        emit_page_records: true

# ============================================================================
# HDB - Housing & Development Board (Singapore)
# ----------------------------------------------------------------------------
# Paste into config/settings.yaml under `crawlers:`, keeping this indentation.
# Scope: sources/sg-hdb/scope.yaml. Platform: sitecore.
# ============================================================================
  hdb:
    label: "Housing & Development Board"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.hdb.gov.sg"
    sitemap_url: "https://www.hdb.gov.sg/sitemap.xml"
    document_hosts:
      - "www.hdb.gov.sg"
    document_path_prefixes:
      - "/-/media/"
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip"]
    strip_document_query: true
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:
      building_professionals:
        # The consultants-and-contractors library: HDB(ARCH)
        # technical requirements, the civil and structural plan
        # submission guidelines, the renovation and A&A
        # guidelines, the documents-and-checklists set, and the
        # updates page that functions as HDB's circular series.
        path_prefixes:
          - "/business-partners/building-professionals-bgbiz"
          - "/business/building-professionals-bgbiz"
        max_pages: 60
        emit_page_records: true
      town_design_guides:
        # One design guide per town, setting the urban design and
        # architectural standards for public housing estates - the
        # closest HDB analogue to the ArchSD design manuals.
        path_prefixes:
          - "/about-us/our-role/plan-and-design-towns"
        max_pages: 60
        emit_page_records: true

# ============================================================================
# JTC - JTC Corporation (Singapore)
# ----------------------------------------------------------------------------
# Paste into config/settings.yaml under `crawlers:`, keeping this indentation.
# Scope: sources/sg-jtc/scope.yaml. Platform: sitecore.
# ============================================================================
  jtc:
    label: "JTC Corporation"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.jtc.gov.sg"
    document_hosts:
      - "www.jtc.gov.sg"
    document_path_prefixes:
      - "/-/media/project/jtc-cx/corpweb/assets/"
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip"]
    strip_document_query: true
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:
      development_and_renovation:
        # JTC's technical requirements for building on its land:
        # the Urban Design Requirements, the Space Submission
        # Handbook, the Fitting-out and Renovation Works Guidebook
        # with its annexes, the usage guidelines for JTC premises
        # and the plot ratio exemptions. The forms-and-documents
        # page is fully server-rendered, which makes this the
        # reliable row here.
        start_urls:
          - "https://www.jtc.gov.sg/get-help/development-and-renovation-works/development-and-renovation-forms-and-documents"
          - "https://www.jtc.gov.sg/get-help/development-and-renovation-works"
        allowed_path_prefixes:
          - "/get-help/development-and-renovation-works"
        max_depth: 3
        max_pages: 40
        emit_page_records: true
      tenancy_requirements:
        # Change-of-use rules and the solar deployment
        # requirements - technical conditions on how JTC premises
        # may be used and altered.
        # The section landing page 404s since Aug 2026; the child pages are
        # alive and linked from the /get-help hub, so seed there. Start URLs
        # are fetched regardless of the prefix filter; only links out of them
        # must match it.
        start_urls:
          - "https://www.jtc.gov.sg/get-help"
        allowed_path_prefixes:
          - "/get-help/managing-your-tenancy-or-lease"
        max_depth: 3
        max_pages: 40
        emit_page_records: true

# ============================================================================
# LTA - Land Transport Authority (Singapore)
# ----------------------------------------------------------------------------
# Paste this block into config/settings.yaml under `crawlers:`, keeping the
# two-space indentation shown here.
#
# Scope is defined in sources/sg-lta/scope.yaml. Every `pages:` entry below
# corresponds to one crawler row there; if you change a prefix here, change it
# there too so the approved scope and the running code stay in step.
#
# LTA is Adobe AEM with no sitemap, so discovery is a bounded spider. The
# safety comes from three bounds applied together - a path allowlist, a depth
# limit and a page budget - rather than from any one of them.
# ============================================================================
  lta:
    label: "Land Transport Authority"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.lta.gov.sg"

    # AEM keeps every published asset under /content/dam/. Nothing in the
    # navigation points there, which makes this a sharper document filter than
    # any content-container heuristic - and it means the spider does not need
    # to identify navigation at all.
    document_hosts:
      - "www.lta.gov.sg"
    document_path_prefixes:
      - "/content/dam/ltagov/"
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip", ".dwg"]

    # LTA publishes its circulars on the whole-of-government CORENET portal
    # rather than on its own site. They are LTA's circulars, so they are
    # recorded - as external references, since the host is not LTA's.
    external_document_hosts:
      - "info.corenet.gov.sg"
      - "www.corenet.gov.sg"

    # CORENET hangs a cache-busting ?sfvrsn= parameter off every asset URL.
    # Left in the record identity it would make each circular look new on
    # every run; the fetchable URL is kept in meta.fetch_url.
    strip_document_query: true

    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    max_out_links_per_page: 800

    pages:
      transport_infrastructure_standards:
        # Civil Design Criteria, Infrastructure and Architectural Design
        # Criteria, Materials & Workmanship specifications, Standard Details of
        # Road Elements. The heart of the source.
        start_urls:
          - "https://www.lta.gov.sg/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources/Transport_Infrastructure_Design_Criteria_and_Specifications.html"
        allowed_path_prefixes:
          - "/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources/Transport_Infrastructure"
        emit_page_records: true
        max_depth: 3
        max_pages: 60

      street_works:
        # Codes of practice for street works, works on public streets and
        # traffic control at work zones, plus TIA guidelines and the forms.
        start_urls:
          - "https://www.lta.gov.sg/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources/street_works/requirements_for_street_work_proposals.html"
        allowed_path_prefixes:
          - "/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources/street_works/"
        emit_page_records: true
        max_depth: 4
        max_pages: 120

      vehicle_parking:
        start_urls:
          - "https://www.lta.gov.sg/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources/vehicle_parking/requirements_for_vehicle_parking_proposals.html"
        allowed_path_prefixes:
          - "/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources/vehicle_parking/"
        emit_page_records: true
        max_depth: 3
        max_pages: 40

      active_mobility:
        start_urls:
          - "https://www.lta.gov.sg/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources/active-mobility/Active_Mobility_Proposals_and_Requirements.html"
        allowed_path_prefixes:
          - "/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources/active-mobility/"
        emit_page_records: true
        max_depth: 3
        max_pages: 40

      railway_protection:
        start_urls:
          - "https://www.lta.gov.sg/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources/railway_protection_road_structure_safety_zones/requirements_for_developments_within_railway_protection_and_road_structure_safety_zone.html"
        allowed_path_prefixes:
          - "/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources/railway_protection_road_structure_safety_zones/"
        emit_page_records: true
        max_depth: 3
        max_pages: 40

      development_construction_resources:
        # The section hub. Depth 0 keeps it on the hub page itself - the
        # sub-sections below it have their own rows, and letting this row
        # follow into them would duplicate every record under a second
        # crawler name and blur the coverage report.
        start_urls:
          - "https://www.lta.gov.sg/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources.html"
        allowed_path_prefixes:
          - "/content/ltagov/en/industry_innovations/industry_matters/development_construction_specifications_resources"
        emit_page_records: true
        max_depth: 0
        max_pages: 5

# ============================================================================
# MND - Ministry of National Development (Singapore)
# ----------------------------------------------------------------------------
# Paste into config/settings.yaml under `crawlers:`, keeping this indentation.
# Scope: sources/sg-mnd/scope.yaml. Platform: sitefinity.
