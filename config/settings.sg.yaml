# ============================================================================
# MOM - Ministry of Manpower (Singapore)
# ----------------------------------------------------------------------------
# Paste into config/settings.yaml under `crawlers:`, keeping this indentation.
# Scope: sources/sg-mom/scope.yaml. Platform: sitecore.
# ============================================================================
  mom:
    label: "Ministry of Manpower"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.mom.gov.sg"
    sitemap_url: "https://www.mom.gov.sg/sitemap.xml"
    document_hosts:
      - "www.mom.gov.sg"
      # The child sitemaps list pages on the bare host, so relative links
      # resolve there too.
      - "mom.gov.sg"
    document_path_prefixes:
      - "/-/media/mom/documents/"
    external_document_hosts:
      - "sso.agc.gov.sg"
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip"]
    strip_document_query: true
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:
      wsh_circulars:
        # The best PDF target on MOM: workplace safety and health
        # circulars from 1999 to the present, grouped by year but
        # with every link present in the served HTML. This is the
        # direct equivalent of the Hong Kong occupational safety
        # and health document sets.
        path_prefixes:
          - "/workplace-safety-and-health/wsh-circulars"
        max_pages: 60
        emit_page_records: true
      wsh_legislation:
        # The Workplace Safety and Health Act and its ~45
        # subsidiary regulations - construction, work at heights,
        # confined spaces, noise, scaffolds. All the text is on
        # Singapore Statutes Online rather than on MOM, so these
        # are external references. They are the law the codes of
        # practice are written under and belong in the library
        # alongside them.
        path_prefixes:
          - "/legislation/workplace-safety-and-health"
        max_pages: 60
        emit_page_records: true
      workplace_safety_and_health:
        # The rest of the WSH tree: pressure vessels and lifting
        # equipment, medical and hygiene monitoring, occupational
        # disease reporting, risk management, and the reports and
        # statistics series. The Hong Kong pressure equipment
        # slide maps here - though note the finding below, because
        # MOM states most of this as web text rather than as
        # documents.
        path_prefixes:
          - "/workplace-safety-and-health"
        exclude_path_patterns:
          - "^/workplace-safety-and-health/wsh-circulars"
        max_pages: 250   # raised from 60: 21 Aug run truncated its queue
        emit_page_records: true

# ============================================================================
# NEA - National Environment Agency (Singapore)
# ----------------------------------------------------------------------------
# Paste into config/settings.yaml under `crawlers:`, keeping this indentation.
# Scope: sources/sg-nea/scope.yaml. Platform: sitecore.
# ============================================================================
  nea:
    label: "National Environment Agency"
    schedule:
      enabled: true
      interval_days: 1
    base_url: "https://www.nea.gov.sg"
    sitemap_url: "https://www.nea.gov.sg/sitemap.xml"
    document_hosts:
      - "www.nea.gov.sg"
    document_path_prefixes:
      - "/docs/default-source/"
    external_document_hosts:
      - "sso.agc.gov.sg"
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip"]
    strip_document_query: true
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:
      practices_and_guidelines:
        # The guidance-document core: the Code of Practice on
        # Environmental Health, the codes for Environmental
        # Control Officers and Coordinators, the waste collector
        # and vector control codes, and the cross-topic guideline
        # set covering boundary noise limits for ACMV systems,
        # pollution control studies and noise mitigation for
        # foodshops and entertainment outlets.
        start_urls:
          - "https://www.nea.gov.sg/corporate-functions/resources/practices-and-guidelines"
        allowed_path_prefixes:
          - "/corporate-functions/resources/practices-and-guidelines"
        max_depth: 3
        max_pages: 40
        emit_page_records: true
      circulars:
        # Four circular series - Development Control, Hazardous
        # Substance Control, Radiation Protection, and Climate
        # Change & Energy Efficiency - reaching back to 1995. Each
        # is a plain server-rendered table of title, PDF, size and
        # date, which makes this the easiest high-yield row on the
        # site.
        start_urls:
          - "https://www.nea.gov.sg/corporate-functions/resources/circulars"
        allowed_path_prefixes:
          - "/corporate-functions/resources/circulars"
        max_depth: 2
        max_pages: 20
        emit_page_records: true
      development_control:
        # Singapore's nearest thing to a statutory environmental
        # impact regime: the Pollution Control Study guidelines,
        # air dispersion modelling guidelines, the Quantitative
        # Risk Assessment criteria and technical guidance, and the
        # land traffic noise impact assessment guideline. This is
        # the row that answers the Hong Kong deck's EA & Planning
        # section.
        start_urls:
          - "https://www.nea.gov.sg/our-services/development-control"
        allowed_path_prefixes:
          - "/our-services/development-control"
        max_depth: 3
        max_pages: 30
        emit_page_records: true
      pollution_control:
        # The Air, Noise, Water, chemical safety and toxic
        # industrial waste topic trees. The Hong Kong deck asked
        # for web text here rather than files, and that
        # instruction is load-bearing on this site: NEA states
        # several binding limits only as HTML tables - the 36-row
        # trade effluent discharge limits and the industrial and
        # construction boundary noise limits have no PDF at all. A
        # document-only crawl would miss the actual standards.
        start_urls:
          - "https://www.nea.gov.sg/our-services/pollution-control"
        allowed_path_prefixes:
          - "/our-services/pollution-control"
        max_depth: 4
        max_pages: 120
        emit_page_records: true
      publications:
