      - "info.corenet.gov.sg"
    document_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip"]
    strip_document_query: true
    request_delay_seconds: 0.5
    request_jitter_seconds: 0.25
    backoff_base_seconds: 0.5
    backoff_jitter_seconds: 0.25
    max_total_records: 50000
    pages:
      acts_codes_and_regulations:
        # The single highest-yield page on the site and the direct
        # answer to the Hong Kong requirement: the Fire Safety Act
        # and its subsidiary legislation, the codes of practice,
        # and the associated forms, all as downloadable files on
        # one server-rendered page.
        start_urls:
          - "https://www.scdf.gov.sg/fire-safety-services-listing/downloads/acts-codes-and-regulations"
        allowed_path_prefixes:
          - "/fire-safety-services-listing/downloads"
        max_depth: 3
        max_pages: 40
        emit_page_records: true
      fire_code:
        # The Fire Code itself - the Code of Practice for Fire
        # Precautions in Buildings - plus the rapid transit and
        # road tunnel codes. The Hong Kong note beside the
        # equivalent slide read 'download only the 13th version is
        # okay'; here the current consolidated Fire Code 2023
        # plays that role.
        start_urls:
          - "https://www.scdf.gov.sg/fire-safety-services-listing/fire-code-2023"
          - "https://www.scdf.gov.sg/fire-safety-services-listing/cpfprts-2022"
          - "https://www.scdf.gov.sg/fire-safety-services-listing/code-of-practice-for-fire-precautions-in-road-tunnels-(cpfprt)-2025"
        allowed_path_prefixes:
          - "/fire-safety-services-listing/fire-code-2023"
          - "/fire-safety-services-listing/cpfprts-2022"
          - "/fire-safety-services-listing/code-of-practice-for-fire-precautions-in-road-tunnels-(cpfprt)-2025"
        max_depth: 2
        max_pages: 40
        emit_page_records: true
      fire_safety_circulars:
        # Circular letters - amendments to the Fire Code and how
        # it is to be applied. Without them the code is a snapshot
        # with no amendment history, which is the same argument
        # that put the BCA circulars in scope.
        start_urls:
          - "https://www.scdf.gov.sg/fire-safety-services-listing/fire-code-2023/circulars"
        allowed_path_prefixes:
          - "/fire-safety-services-listing/fire-code-2023/circulars"
        max_depth: 2
        max_pages: 20
        emit_page_records: true
      petroleum_and_flammable_materials:
        # Petroleum and flammable materials licensing, storage
        # requirements and the transport circulars for dangerous
        # goods - the hazardous-materials half of SCDF's
        # regulatory remit.
        start_urls:
          - "https://www.scdf.gov.sg/fire-safety-services-listing/petroleum-and-flammable-material-licences"
        allowed_path_prefixes:
          - "/fire-safety-services-listing/petroleum-and-flammable-material-licences"
        max_depth: 3
        max_pages: 30
        emit_page_records: true
      advisories:
        # Fire safety and emergency advisories - the notices and
        # guidance row of the Hong Kong deck.
        start_urls:
          - "https://www.scdf.gov.sg/home/about-scdf/media-room/publications/fire-safety-and-emergency-advisories"
        allowed_path_prefixes:
          - "/home/about-scdf/media-room/publications/fire-safety-and-emergency-advisories"
        max_depth: 2
        max_pages: 20
        emit_page_records: true

